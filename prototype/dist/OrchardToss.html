<script>
/* Orchard Toss — js/config.js
 * OT.CONFIG: every tunable for the prototype lives here (see ARCHITECTURE.md, "js/config.js").
 * Plain script, ES2015 max, works in the browser (window.OT) and in Node (module.exports).
 *
 * Level ramp decisions (tunables, all in this file):
 *   Zone bands   : Spring 1-10, Summer 11-22, Autumn 23-36, Winter 37-52.
 *   Fruit unlocks: cumulative across zones. A new zone's fruits are introduced one at a time
 *                  at indexInZone thresholds FRUIT_INTRO (Spring starts with two types so a
 *                  level-1 board is never single-typed).
 *   fill         : linear per zone, FILL_RAMP[zone] = [first level, last level].
 *   timeLimit    : linear per zone, TIME_RAMP[zone] = [first level, last level] (seconds, integer).
 *   obstacles    : per zone via OBSTACLE_RAMP[zone](indexInZone, levels).
 */
(function () {
  var root = (typeof window !== 'undefined') ? window : (typeof globalThis !== 'undefined' ? globalThis : this);
  root.OT = root.OT || {};
  var OT = root.OT;

  var ZONES = [
    { id: 'spring', name: 'Spring', levels: 10, fruits: ['cherry', 'strawberry', 'apple'] },
    { id: 'summer', name: 'Summer', levels: 12, fruits: ['watermelon', 'grape', 'banana'] },
    { id: 'autumn', name: 'Autumn', levels: 14, fruits: ['pomegranate', 'pineapple'] },
    { id: 'winter', name: 'Winter', levels: 16, fruits: ['orange', 'lemon'] }
  ];

  // indexInZone at which each of the zone's fruits is unlocked (parallel to ZONES[i].fruits)
  var FRUIT_INTRO = {
    spring: [0, 0, 2],
    summer: [0, 2, 4],
    autumn: [0, 2],
    winter: [0, 2]
  };

  // board fill fraction over the zone, [first level, last level]
  var FILL_RAMP = {
    spring: [0.50, 0.60],
    summer: [0.58, 0.66],
    autumn: [0.62, 0.70],
    winter: [0.66, 0.75]
  };

  // time limit in seconds over the zone, [first level, last level]
  // 2026-09-02 pacing retune (QA finding A): was Spring 60->50, others 55->45, under which the time bonus refunded the
  // whole level and every archetype cleared with 90-100% time left. See TUNING.TIME_* in board.js and STAR_FRACTIONS.
  var TIME_RAMP = {
    spring: [45, 38],
    summer: [40, 32],
    autumn: [40, 32],
    winter: [40, 32]
  };

  // obstacle counts per zone as a function of indexInZone (0-based) and zone length
  var OBSTACLE_RAMP = {
    spring: function () { return { walls: 0, trellis: 0, pipes: 0, coconuts: 0 }; },
    summer: function (i, len) { return { walls: (i < len / 2) ? 1 : 2, trellis: 0, pipes: 0, coconuts: 0 }; },
    autumn: function (i, len) { return { walls: 2, trellis: 1, pipes: 0, coconuts: (i < len / 2) ? 1 : 2 }; },
    winter: function (i, len) {
      var late = i >= len / 2;
      return { walls: late ? 3 : 2, trellis: late ? 2 : 1, pipes: late ? 2 : 1, coconuts: 2 };
    }
  };

  function lerp(a, b, t) { return a + (b - a) * t; }

  function levelDef(n) {
    n = Math.floor(Number(n));
    if (!(n >= 1 && n <= 52)) throw new Error('levelDef: n must be 1..52, got ' + n);
    var zoneIndex = 0, start = 1;
    while (n >= start + ZONES[zoneIndex].levels) { start += ZONES[zoneIndex].levels; zoneIndex++; }
    var zone = ZONES[zoneIndex];
    var indexInZone = n - start;
    var t = zone.levels > 1 ? indexInZone / (zone.levels - 1) : 0;

    var fruits = [];
    for (var z = 0; z <= zoneIndex; z++) {
      var zf = ZONES[z].fruits, intro = FRUIT_INTRO[ZONES[z].id];
      for (var k = 0; k < zf.length; k++) {
        if (z < zoneIndex || indexInZone >= intro[k]) fruits.push(zf[k]);
      }
    }

    var fillRamp = FILL_RAMP[zone.id], timeRamp = TIME_RAMP[zone.id];
    return {
      n: n,
      zone: zone.id,
      zoneName: zone.name,
      zoneIndex: zoneIndex,
      indexInZone: indexInZone,
      zoneLevels: zone.levels,
      rows: 8,
      cols: 5,
      fill: Math.round(lerp(fillRamp[0], fillRamp[1], t) * 1000) / 1000,
      timeLimit: Math.round(lerp(timeRamp[0], timeRamp[1], t)),
      fruits: fruits,
      obstacles: OBSTACLE_RAMP[zone.id](indexInZone, zone.levels)
    };
  }

  OT.CONFIG = {
    W: 480, H: 854, COLS: 5, ROWS: 8, CELL: 76, BOARD_X: 50, BOARD_Y: 126, LAUNCH_Y: 800,
    FRUITS: ['cherry', 'strawberry', 'apple', 'watermelon', 'grape', 'banana', 'pomegranate', 'pineapple', 'orange', 'lemon'],
    ZONES: ZONES,
    TOTAL_LEVELS: 52,
    HEARTS_MAX: 5, HEART_REFILL_MS: 30 * 60 * 1000,
    LOCKOUT_S: 0.6, FLIGHT_SPEED: 1100 /* px/s */,
    STAR_FRACTIONS: [0.8, 0.5] /* >=80% time left = 3 stars, >=50% = 2, else 1 (was [0.5, 0.25]: gave 3 stars to everyone, QA 2026-09-02) */,
    FRUIT_INTRO: FRUIT_INTRO, FILL_RAMP: FILL_RAMP, TIME_RAMP: TIME_RAMP, OBSTACLE_RAMP: OBSTACLE_RAMP,
    levelDef: levelDef
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = OT.CONFIG;

<script>
/* Orchard Toss — js/board.js
 * OT.Board: pure game logic (no DOM, no canvas), deterministic via a seeded RNG (mulberry32).
 * Plain script, ES2015 max. Works in the browser (window.OT) and in Node (module.exports).
 * Contract: ARCHITECTURE.md, "Gameplay model" and "js/board.js".
 *
 * Grid: cells[row][col], row 0 = TOP (canopy). Launched fruit enters at row rows-1 and travels UP.
 * Cell values: null | {kind:'fruit', type} | {kind:'coconut'} | {kind:'wall', lean:-1|1} | {kind:'trellis'} | {kind:'pipe'}
 *
 * ADDITIONS beyond the contract (no contract signature changed):
 *   OT.Board.trace(board, col)      -> {path, deflections, impact}  non-mutating launch path (aiming hints)
 *   OT.Board.parse(text, opts)      -> board   inverse of snapshot(): builds a fixture board from grid text
 *   OT.Board.recount(board)         -> board   recompute initialFruit/remaining/target from cells (after editing cells)
 *   OT.Board.reachableTypes(board)  -> {type: count}  the weights used for the queue draw
 *   OT.Board.TUNING                 -> scores / time bonus / generator caps (tunable without touching logic)
 *   board.warnings                  -> [] of strings (generator gave up after TUNING.GEN_TRIES)
 *
 * INTERPRETATIONS (documented decisions):
 *   - isWinnable: launch reachability is computed as a fixed point over column segments (a segment is a
 *     maximal run of non-obstacle cells in a column). Plain launches (any type, power-ups ignored) clear every
 *     fruit they can reach; coconuts are never cleared and keep blocking their lane. "Sealed" = every tile the
 *     simulation cannot clear (unreachable fruit + all coconuts). Winnable <=> sealed <= target-1 AND at least
 *     one fruit is directly reachable. The generator caps coconuts + wall-sealed tiles at target-1 accordingly.
 *   - Cherry pair (redefined 2026-09-02; the old "next cherry run up the same column" was unreachable: 0 doubles in 381
 *     launches because compaction never leaves a second run above a gap): the launched cherry fires into its lane AND
 *     its twin fires into the ADJACENT lane - the side whose trace impact is a cherry, else right (left at the right
 *     edge; TUNING.CHERRY_TWIN_SIDE). The twin follows the same wall/pipe/trellis rules. It resolves only when the
 *     primary matched (a primary mismatch returns the pair together: result.twin = null, board untouched). If the twin
 *     also hits a cherry, that run clears too (result.powerup.cells, effect {kind:'burst'}) and the whole launch scores
 *     x2 (result.cherryDouble); if it mismatches it simply returns, no penalty. result.twin = {col, path, deflections,
 *     impact, matched} so game.js can animate it; result.path stays the primary's path.
 *   - CLUSTER_BIAS (generator): when a column is filled top-down, each new tile copies the type of the tile directly
 *     above it with probability TUNING.CLUSTER_BIAS (else a uniform draw). Measured at 0 (uniform): matched runs averaged
 *     1.1 tiles and 55% of matches needed the hand rescue. The RNG is only consumed when the bias is > 0, so bias 0
 *     reproduces the pre-2026-09-02 boards exactly. The ">= 2 of every present type" pass and winnability are unchanged.
 *   - Pineapple breaks the first 4-adjacent obstacle in the order up, left, right, down. A broken coconut
 *     is a tile: it appears in BOTH result.broken and result.cleared (and decrements remaining).
 *   - Grape: result.run stays the vertical line; the rest of the 4-connected cluster is result.powerup.cells.
 *   - HAND RESCUE (TUNING.HAND_RESCUE, default on): a mismatch never changes the hand, so a held type with no lane
 *     target is a soft-lock. Measured without it: 23% of fresh hands were dead and 96% of boards locked within ~4
 *     hands (queue entries are drawn 3 launches ahead and power-ups reshuffle every lane). After a match, if the new
 *     held type is not the impact tile of any lane, it is swapped with the first queue entry that is (or redrawn if
 *     none is); reported as result.handRescue = null | {kind:'swap', queueIndex} | {kind:'redraw'}. Queue entries
 *     whose type has no tiles left on the board are redrawn too (result.queueRedrawn = [indices]).
 *   - LOOKAHEAD DRAW (TUNING.DRAW_LOOKAHEAD, 2026-09-02): a queue entry is used k hands from now, but was drawn from the
 *     lanes of the CURRENT board - the very tiles the intervening hands clear - so 48% of matches still needed the rescue
 *     (insensitive to draw weights and CLUSTER_BIAS). Each queue entry is now drawn from the lanes of a private copy on
 *     which the preceding hand has been played greedily (simCopy/predictBoard; the copy's draws never recurse). The held

    SCORE_POWER: 15,          // per tile cleared by a power-up or chain
    CHERRY_MULT: 2,           // whole launch x2 on a cherry double
    ORANGE_CHAIN_MULT: 0.5,   // score x (1 + 0.5 * chain)
    ORANGE_ROUNDS: 4,         // max chain rounds
    POMEGRANATE_COUNT: 5,     // random tiles cleared elsewhere
    TIME_RUN: 0.25,           // seconds back per run tile (was 0.5: the bonus refunded the whole level, QA 2026-09-02)
    TIME_POWER: 0.5,          // seconds back per power-up/chain tile (was 1.0)
    TIME_CAP: 3,              // max seconds back per launch (was 5)

<script>
/* =========================================================================

   no images, no fetch, no DOM access at load time. Runs from file://.

   Contract (prototype/ARCHITECTURE.md, "js/sprites.js — OT.S"):
     OT.S.PALETTE        { spring|summer|autumn|winter : {sky, skyLow, ground,
                           groundDark, accent, banner, button, text} }
     OT.S.FRUIT_COLORS   { cherry|... : {main, dark, shine} }
     OT.S.fruit(ctx, type, x, y, size, t)
     OT.S.coconut(ctx, x, y, size, t)
     OT.S.wall(ctx, x, y, size, lean, season)
     OT.S.trellis(ctx, x, y, size, season)
     OT.S.pipe(ctx, x, y, size, season)
     OT.S.background(ctx, w, h, season, t)          AMBIENT ONLY
     OT.S.landmarks(ctx, W, H, season, progress, t) ONE tree + fence + sun/moon
     OT.S.boardFrame(ctx, x, y, w, h, season)
     OT.S.sprout(ctx, x, y, size, stage, mood, t)
     OT.S.launcher(ctx, x, y, w, heldType, locked, t)
     OT.S.monkey(ctx, x, y, size, t)
     OT.S.splash(ctx, x, y, type, p)
     OT.S.heart(ctx, x, y, size, filled)
     OT.S.star(ctx, x, y, size, filled)
     OT.S.banner(ctx, cx, cy, w, h, color, text, s)
     OT.S.button(ctx, cx, cy, w, h, color, text, s)
     OT.S.panel(ctx, x, y, w, h, color)
     OT.S.text(ctx, txt, x, y, size, color, align, outline)
     OT.S.font(size) -> string

   - Every painter is centred on (x, y) unless the contract says otherwise
     (`panel` and `boardFrame` take a top-left x,y like the contract's HUD
     usage; `background` paints the rect 0,0,w,h).
   - `t` is seconds; any value (undefined, NaN, negative) is safe.
   - Every painter does ctx.save()/restore() and leaks no state.
   - Apple is painted GREEN (Granny Smith) rather than red: the three Spring
     fruits (cherry, strawberry, apple) all appear together from level 1 and

     stem + dented top keep it unmistakably an apple.

     drop shadow, colour block, dark bottom edge, gloss strip, outline, bold

  spring: { sky: '#8fd4ff', skyLow: '#ffe4f1', ground: '#a3e46f', groundDark: '#5bb44a',
            accent: '#ff9ccd', banner: '#ff7eb6', button: '#63cf5b', text: '#ffffff' },

  autumn: { sky: '#e8a052', skyLow: '#ffe1b0', ground: '#dd9540', groundDark: '#8c3a2b',

  winter: { sky: '#3d6fae', skyLow: '#c5ecea', ground: '#b3dfd9', groundDark: '#4d8f8a',

  strawberry:  { main: '#ff4d6d', dark: '#b3163f', shine: '#ffb3c1' },
  apple:       { main: '#8fd83a', dark: '#4a9418', shine: '#dcff9a' },
  watermelon:  { main: '#ff4f5e', dark: '#217f32', shine: '#ffc2c8' },
  grape:       { main: '#8e44d6', dark: '#48177f', shine: '#d6b3ff' },
  banana:      { main: '#ffd53e', dark: '#c98d12', shine: '#fff2b0' },
  pomegranate: { main: '#e0307a', dark: '#87124c', shine: '#ffa6cf' },
